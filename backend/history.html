<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:15px -apple-system,system-ui,sans-serif; background:#0d1117; color:#e6edf3; }
  header { padding:14px 18px; border-bottom:1px solid #21262d; }
  h1 { font-size:17px; margin:0; }
  .sub { color:#8b949e; font-size:13px; margin-top:4px; }
  .wrap { padding:14px 18px; max-width:840px; }
  .card { border:1px solid #21262d; border-radius:8px; padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .card:hover { border-color:#388bfd; }
  .card .when { color:#8b949e; font-size:13px; }
  .card .meta { font-size:13px; margin-top:3px; }
  .empty,.err { color:#8b949e; padding:24px 4px; }
  .err { color:#f85149; }
  h3 { font-size:13px; color:#8b949e; margin:14px 0 6px; }
  .line { margin:6px 0; }
  .who { font-family:ui-monospace,monospace; font-size:11px; }
  .src { color:#8b949e; }
  .tr { margin-left:30px; }
  #detail { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); overflow:auto; }
  #panel { max-width:840px; margin:36px auto; background:#0d1117; border:1px solid #30363d; border-radius:10px; padding:18px; }
  button { background:#30363d; border:0; color:#fff; padding:7px 13px; border-radius:6px; font-size:14px; cursor:pointer; }
  .gate { padding:26px 18px; }
  input { background:#0d1117; border:1px solid #30363d; color:#e6edf3; padding:8px 10px; border-radius:6px; font-size:14px; width:260px; }
</style>
</head>
<body>
<header style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
  <h1 id="h1">🗂️ 지난 회의 기록</h1>
  <div class="sub" id="sub"></div>
  <select id="langSel" style="margin-left:auto;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 8px">
    <option value="ko">한국어</option><option value="ja">日本語</option><option value="en">English</option>
  </select>
</header>

<div class="gate" id="gate" style="display:none">
  <p id="gatePrompt"></p>
  <p><input id="key" type="password"></p>
  <p><input id="rs" type="password"></p>
  <button id="gateBtn" onclick="saveCreds()"></button>
  <div class="err" id="gateErr"></div>
</div>

<div class="wrap" id="main" style="display:none">
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none"></div>
</div>

<div id="detail"><div id="panel">
  <div style="display:flex;gap:10px;align-items:center">
    <h2 style="font-size:15px;margin:0" id="dTitle"></h2>
    <button id="closeBtn" style="margin-left:auto" onclick="document.getElementById('detail').style.display='none'"></button>
  </div>
  <div id="dBody" style="margin-top:12px;user-select:text"></div>
</div></div>

<script>
  var P = new URLSearchParams(location.search);
  var room = P.get("room") || "default";

  // --- i18n ---
  var STR = {
    title:    {ko:"🗂️ 지난 회의 기록", ja:"🗂️ 過去の会議の記録", en:"🗂️ Past meeting records"},
    gate:     {ko:"이 방의 기록을 보려면 비밀번호가 필요합니다.", ja:"このルームの記録を見るにはパスワードが必要です。", en:"A password is required to view this room's records."},
    key:      {ko:"접속 비밀번호", ja:"接続パスワード", en:"Access password"},
    rs:       {ko:"방 비번 (있으면)", ja:"ルームのパスワード（あれば）", en:"Room password (if any)"},
    open:     {ko:"열기", ja:"開く", en:"Open"},
    close:    {ko:"닫기", ja:"閉じる", en:"Close"},
    empty:    {ko:"아직 저장된 회의 기록이 없습니다.", ja:"まだ保存された会議記録がありません。", en:"No saved meeting records yet."},
    disabled: {ko:"기록 저장이 비활성화되어 있습니다.", ja:"記録の保存が無効になっています。", en:"Record saving is disabled."},
    detail:   {ko:"회의 상세", ja:"会議の詳細", en:"Meeting details"},
    sentences:{ko:"문장", ja:"文", en:"sentences"},
    truncated:{ko:" (일부 잘림)", ja:"（一部省略）", en:" (partly truncated)"},
    keySummary:{ko:"핵심 요약", ja:"要約", en:"Summary"},
    keyPoints:{ko:"핵심 포인트", ja:"要点", en:"Key points"},
    nextActions:{ko:"다음 액션", ja:"ネクストアクション", en:"Next actions"},
    transcript:{ko:"전사 (원문 → 번역)", ja:"文字起こし（原文 → 翻訳）", en:"Transcript (source → translation)"},
    showRaw:  {ko:"원문 그대로 보기", ja:"元のまま表示", en:"Show raw"},
    showClean:{ko:"다듬은 버전 보기", ja:"整形版を表示", en:"Show cleaned"},
    cleanedNote:{ko:"AI가 다듬은 전사입니다 (음성인식 오류·군말 정리, 끊긴 문장 합침).", ja:"AIが整形した文字起こしです（認識ミス・言い淀みを整理し、分割された文を結合）。", en:"AI-cleaned transcript (ASR errors & fillers removed, split sentences merged)."},
    keyWrong: {ko:"접속 비밀번호가 올바르지 않습니다.", ja:"接続パスワードが正しくありません。", en:"Wrong access password."},
    rsWrong:  {ko:"방 비번이 올바르지 않습니다.", ja:"ルームのパスワードが正しくありません。", en:"Wrong room password."},
    loadFail: {ko:"불러오기 실패", ja:"読み込み失敗", en:"Load failed"},
    connErr:  {ko:"연결 오류", ja:"接続エラー", en:"Connection error"},
    loading:  {ko:"불러오는 중…", ja:"読み込み中…", en:"Loading…"},
  };
  var lang = P.get("lang"); if(["ko","ja","en"].indexOf(lang)<0){ try{lang=localStorage.getItem("rtHistLang");}catch(e){} }
  if(["ko","ja","en"].indexOf(lang)<0) lang = "ko";
  function T(k){ return (STR[k]||{})[lang] || (STR[k]||{}).ko || k; }
  function applyLang(){
    document.getElementById("h1").textContent = T("title");
    document.getElementById("gatePrompt").textContent = T("gate");
    document.getElementById("key").placeholder = T("key");
    document.getElementById("rs").placeholder = T("rs");
    document.getElementById("gateBtn").textContent = T("open");
    document.getElementById("closeBtn").textContent = T("close");
    document.getElementById("langSel").value = lang;
    document.title = T("detail");
  }
  document.getElementById("langSel").onchange = function(e){
    lang = e.target.value; try{localStorage.setItem("rtHistLang",lang);}catch(_){}
    applyLang(); load();
  };
  applyLang();
  // creds: URL first, else saved per-room, else prompt
  function cred(name){
    var u = P.get(name);
    if(u){ try{localStorage.setItem("rt:"+name+":"+room,u);}catch(e){} return u; }
    try{ return localStorage.getItem("rt:"+name+":"+room)||""; }catch(e){ return ""; }
  }
  var key = cred("key"), rs = cred("rs");
  document.getElementById("sub").textContent = ({ko:"방: ",ja:"ルーム: ",en:"Room: "}[lang]||"방: ")+room;

  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(ms){ if(!ms) return "—"; return new Date(ms).toLocaleString([],{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
  function dur(s){ if(s==null) return ""; var u={ko:["초","분"],ja:["秒","分"],en:["s","m"]}[lang]||["초","분"]; if(s<60) return s+u[0]; return Math.floor(s/60)+u[1]; }

  function saveCreds(){
    key=document.getElementById("key").value.trim();
    rs=document.getElementById("rs").value.trim();
    try{ localStorage.setItem("rt:key:"+room,key); localStorage.setItem("rt:rs:"+room,rs); }catch(e){}
    load();
  }
  function q(extra){ return "room="+encodeURIComponent(room)+"&key="+encodeURIComponent(key)+"&rs="+encodeURIComponent(rs)+(extra||""); }

  async function load(){
    if(!key){ document.getElementById("gate").style.display="block"; document.getElementById("main").style.display="none"; return; }
    try {
      var r = await fetch("/history/list?"+q(), {cache:"no-store"});
      if(r.status===401){ showGate(T("keyWrong")); return; }
      if(r.status===403){ showGate(T("rsWrong")); return; }
      var d = await r.json();
      document.getElementById("gate").style.display="none";
      document.getElementById("main").style.display="block";
      var s = d.sessions||[];
      document.getElementById("list").innerHTML = s.map(function(x){
        return "<div class='card' onclick=\"openOne('"+encodeURIComponent(x.transcript_key||"")+"')\">"
          + "<div class='when'>"+fmt(x.started_ms)+" ~ "+fmt(x.ended_ms)+"</div>"
          + "<div class='meta'>"+(x.finals||0)+T("sentences")+" · "+dur(x.duration_s)+" · "+((x.pair||[]).join("-"))+"</div></div>";
      }).join("");
      var emp=document.getElementById("empty");
      emp.textContent=T("empty"); emp.style.display = s.length? "none":"block";
      if(!d.enabled) emp.textContent=T("disabled");
    } catch(e){ showGate(T("connErr")); }
  }
  function showGate(msg){
    document.getElementById("gate").style.display="block";
    document.getElementById("main").style.display="none";
    document.getElementById("gateErr").textContent=msg||"";
  }
  async function openOne(encId){
    if(!encId){ return; }
    showRaw=false;   // each session opens on the cleaned view
    var dl=document.getElementById("detail"), b=document.getElementById("dBody");
    b.innerHTML="<p class='src'>"+T("loading")+"</p>"; dl.style.display="block";
    try {
      var r=await fetch("/history/get?"+q("&id="+encId),{cache:"no-store"});
      if(r.status!==200){ b.innerHTML="<p class='err'>"+T("loadFail")+" ("+r.status+")</p>"; return; }
      var d=await r.json();
      renderDetail(d);
    } catch(e){ b.innerHTML="<p class='err'>"+T("connErr")+"</p>"; }
  }

  // A cleaned transcript (transcript_clean) is shown by default; the raw one is
  // one toggle away. Older sessions archived before cleanup existed have no
  // transcript_clean, so we silently fall back to raw (no toggle shown).
  var showRaw = false;
  function lineHTML(t){
    // mic is tagged "me" (older data may say "mic"); everything else is "them".
    var me=(t.stream==="me"||t.stream==="mic");
    var who=me?"ME":"THEM", c=me?"#79c0ff":"#3fb950";
    return "<div class='line'><span class='who' style='color:"+c+"'>"+who+"</span> "
      +"<span class='src'>"+esc(t.source)+"</span><br><span class='tr'>"+esc(t.translation)+"</span></div>";
  }
  function renderDetail(d){
    var b=document.getElementById("dBody"), sm=d.summary||{}, h="";
    var hasClean=!!(d.transcript_clean && d.transcript_clean.length);
    document.getElementById("dTitle").textContent=T("detail")+" · "+(d.lines||0)+T("sentences")+(d.truncated?T("truncated"):"");
    if(sm.summary){ h+="<h3>"+T("keySummary")+"</h3><p>"+esc(sm.summary)+"</p>"; }
    if((sm.key_points||[]).length){ h+="<h3>"+T("keyPoints")+"</h3><ul>"+sm.key_points.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+"</ul>"; }
    if((sm.next_actions||[]).length){ h+="<h3>"+T("nextActions")+"</h3><ul>"+sm.next_actions.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+"</ul>"; }
    h+="<h3 style='display:flex;align-items:center;gap:10px'>"+T("transcript");
    if(hasClean){
      h+="<button id='rawToggle' style='font:12px system-ui;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:3px 9px;cursor:pointer'>"
        +(showRaw?T("showClean"):T("showRaw"))+"</button>";
    }
    h+="</h3>";
    if(hasClean && !showRaw){ h+="<p class='src' style='margin:-4px 0 8px;opacity:.7'>"+T("cleanedNote")+"</p>"; }
    var rows=(hasClean && !showRaw) ? d.transcript_clean : (d.transcript||[]);
    h+=rows.filter(function(t){return !t.truncated;}).map(lineHTML).join("");
    b.innerHTML=h;
    var tb=document.getElementById("rawToggle");
    if(tb){ tb.onclick=function(){ showRaw=!showRaw; renderDetail(d); }; }
  }
  load();
</script>
</body>
</html>
