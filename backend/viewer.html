<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>실시간 번역 자막 / Live Subtitles</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0b0d12; color:#f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans JP", sans-serif; }
  #bar { position:fixed; top:0; left:0; right:0; height:38px; display:flex;
    align-items:center; gap:10px; padding:0 14px; background:#11141b;
    border-bottom:1px solid #1f2430; font-size:13px; z-index:10; }
  #dot { width:9px; height:9px; border-radius:50%; background:#6b7280; }
  #dot.live { background:#22c55e; } #dot.off { background:#ef4444; }
  #status { opacity:.7; }
  #log { padding:54px 18px 40vh; max-width:920px; margin:0 auto;
    display:flex; flex-direction:column; gap:13px; }
  .line { font-size:29px; line-height:1.36; }
  @media (min-width:700px){ .line{ font-size:37px; } }
  .tag { display:inline-block; font-size:.5em; font-weight:700; padding:2px 8px;
    border-radius:6px; margin-right:8px; vertical-align:middle; color:#fff; }
  .me   .tag { background:#1d4ed8; }
  .them .tag { background:#047857; }
  .src  { opacity:.45; font-size:.6em; display:block; margin-top:3px; }
  .interim { opacity:.5; font-style:italic; }
  #empty { opacity:.4; text-align:center; margin-top:30vh; font-size:18px; }
</style>
</head>
<body>
<div id="bar"><span id="dot"></span><span id="status">연결 중… / connecting…</span></div>
<div id="log"></div>
<div id="empty">자막을 기다리는 중입니다 / waiting for speech…</div>
<script>
(function () {
  var logEl = document.getElementById("log");
  var statusEl = document.getElementById("status");
  var dotEl = document.getElementById("dot");
  var emptyEl = document.getElementById("empty");
  // Access password: from ?key=... in the URL, or saved, or prompt once.
  function getKey() {
    var u = new URLSearchParams(location.search).get("key");
    if (u) { try { localStorage.setItem("rtKey", u); } catch(e){} return u; }
    var saved = null; try { saved = localStorage.getItem("rtKey"); } catch(e){}
    if (saved) return saved;
    var k = window.prompt("접속 비밀번호 / Access password:") || "";
    try { localStorage.setItem("rtKey", k); } catch(e){}
    return k;
  }
  var rtKey = getKey();
  // Room/meeting id from ?room=... — must match the capture's room to receive
  // its subtitles (concurrent meetings on one box are isolated by room).
  var rtRoom = new URLSearchParams(location.search).get("room") || "default";
  // Optional per-room secret (?rs=) for locked rooms; saved like the password.
  var rtSecret = new URLSearchParams(location.search).get("rs");
  if (rtSecret) { try { localStorage.setItem("rtSecret:"+rtRoom, rtSecret); } catch(e){} }
  else { try { rtSecret = localStorage.getItem("rtSecret:"+rtRoom) || ""; } catch(e){ rtSecret = ""; } }
  // Same host as the page; CloudFront routes /viewsock to the relay WS.
  function buildURL() {
    var u = (location.protocol === "https:" ? "wss://" : "ws://")
      + location.host + "/viewsock?token=" + encodeURIComponent(rtKey)
      + "&room=" + encodeURIComponent(rtRoom);
    if (rtSecret) u += "&rs=" + encodeURIComponent(rtSecret);
    return u;
  }
  var interimNodes = {};   // (stream:seq) -> node, for in-place interim updates
  var finalNodes = {};     // (stream:seq) -> node, so a later "refine" frame
                           // can swap the line's translation in place
  var ws, backoff = 500;

  function atBottom() {
    return window.innerHeight + window.scrollY >= document.body.scrollHeight - 90;
  }
  function escapeHTML(s){ var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
  function tagFor(m) {
    if (m.stream === "me")   return ["me", "ME"];
    if (m.stream === "them") return ["them", "THEM"];
    return [m.src === "ko" ? "me" : "them", (m.src||"").toUpperCase()];
  }

  function render(m, isFinal) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    var t = tagFor(m), cls = t[0], label = t[1];
    var key = (m.stream || m.src || "") + ":" + m.seq;
    var stick = atBottom();
    var node = isFinal ? null : interimNodes[key];
    if (!node) {
      node = document.createElement("div");
      logEl.appendChild(node);
      if (!isFinal) interimNodes[key] = node;
    }
    node.className = "line " + cls + (isFinal ? "" : " interim");
    node.innerHTML = '<span class="tag">' + label + '</span>'
      + escapeHTML(m.translation || "…")
      + '<span class="src">' + escapeHTML(m.source || "") + '</span>';
    if (isFinal && interimNodes[key]) {
      if (interimNodes[key] !== node) interimNodes[key].remove();
      delete interimNodes[key];
    }
    if (isFinal) finalNodes[key] = node;
    if (stick) window.scrollTo(0, document.body.scrollHeight);
  }

  // Echo dedup: this utterance was the other stream's audio leaking in — its
  // final was suppressed server-side; remove the orphaned grey interim line.
  function dedup(m) {
    var key = (m.stream || "") + ":" + m.seq;
    if (interimNodes[key]) { interimNodes[key].remove(); delete interimNodes[key]; }
  }

  // Post-final refine: the server re-translated a finalized line with more
  // context — swap the translation in place (no new line, no reflow jump).
  function refine(m) {
    var key = (m.stream || m.src || "") + ":" + m.seq;
    var node = finalNodes[key];
    if (!node) return;   // line already cleared/scrolled out of our map
    var t = tagFor(m);
    node.innerHTML = '<span class="tag">' + t[1] + '</span>'
      + escapeHTML(m.translation || "…")
      + '<span class="src">' + escapeHTML(m.source || "") + '</span>';
  }

  function setStatus(txt, state) {
    statusEl.textContent = txt;
    dotEl.className = state || "";
  }

  // Panic wipe from the operator (/control/clear): blank every accumulated line
  // and bring back the "waiting" placeholder, as if the tab were freshly opened.
  function clearLog() {
    logEl.innerHTML = "";
    interimNodes = {};
    finalNodes = {};
    if (!emptyEl) {
      emptyEl = document.createElement("div");
      emptyEl.id = "empty";
      document.body.appendChild(emptyEl);
    }
    emptyEl.textContent = "자막을 기다리는 중입니다 / waiting for speech…";
  }

  function connect() {
    ws = new WebSocket(buildURL());
    ws.onopen = function () {
      setStatus("실시간 / live", "live");
      backoff = 500;
      try { ws.send(JSON.stringify({ type: "subscribe", role: "viewer" })); } catch (e) {}
    };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "final") render(m, true);
      else if (m.type === "interim") render(m, false);
      else if (m.type === "refine") refine(m);
      else if (m.type === "dedup") dedup(m);
      else if (m.type === "clear") clearLog();
    };
    ws.onclose = function (ev) {
      // 4401 = wrong/missing password: clear it and re-prompt instead of looping.
      if (ev && ev.code === 4401) {
        try { localStorage.removeItem("rtKey"); } catch(e){}
        setStatus("비밀번호 오류 / wrong password", "off");
        rtKey = getKey();
        setTimeout(connect, 300);
        return;
      }
      setStatus("재연결 중… / reconnecting…", "off");
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 8000);
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  connect();
})();
</script>
</body>
</html>
